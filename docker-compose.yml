services:
  planner-db:
    image: postgres:16-alpine
    container_name: ai-portal-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_portal}
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ai_portal_planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-ai_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_portal_planner_pgdata: